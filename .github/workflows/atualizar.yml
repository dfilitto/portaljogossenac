name: Atualizar Catálogo de Jogos

on:
  push:
    paths:
      - 'jogos.txt'
      - 'atualizar.js'
  workflow_dispatch: # Permite rodar manualmente clicando em um botão se quiser

permissions:
  contents: write

jobs:
  build-catalogo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extrair dados do Itch.io e gerar catalogo.json
        run: node atualizar.js

      - name: Salvar catalogo.json no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catalogo.json
          git diff --staged --quiet || git commit -m "chore: atualiza catalogo.json automaticamente"
          git push
