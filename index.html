<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Jogos Digitais - Alunos Senac</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --accent: #f97316;
            --accent-hover: #ea580c;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding: 24px;
            min-height: 100vh;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 28px auto;
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #f8fafc, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .controls {
            max-width: 1200px;
            margin: 0 auto 28px auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: var(--bg-card);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .top-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 240px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            background: var(--bg-input);
            color: var(--text-secondary);
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent);
            color: white;
        }

        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
            border-color: rgba(249, 115, 22, 0.4);
        }

        .card-thumb {
            width: 100%;
            aspect-ratio: 315 / 250;
            object-fit: cover;
            background: #090d16;
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-category {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .card-author {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 14px;
        }

        .platforms-info {
            margin-top: auto;
            margin-bottom: 14px;
        }

        .platforms-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: block;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge.mobile { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge.desktop { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge.web { background: rgba(139, 92, 246, 0.15); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.3); }

        .btn-play {
            display: block;
            text-align: center;
            background: var(--accent);
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn-play:hover {
            background: var(--accent-hover);
        }

        .status-msg {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 JOGOS DESENVOLVIDOS PELOS ALUNOS DO SENAC PRESIDENTE PRUDENTE</h1>
        <p>Explore, jogue e conheça os projetos desenvolvidos pelos estudantes</p>
    </header>

    <section class="controls">
        <div class="top-filters">
            <div class="search-box">
                <input type="text" id="inputBusca" placeholder="🔍 Buscar por nome do jogo ou autor...">
            </div>
            <div class="filter-group" id="filtroPlataforma">
                <button class="filter-btn active" data-plat="todas">Todas Plataformas</button>
                <button class="filter-btn" data-plat="web">🌐 Web</button>
                <button class="filter-btn" data-plat="desktop">💻 Desktop</button>
                <button class="filter-btn" data-plat="mobile">📱 Mobile</button>
            </div>
        </div>
        <div class="filter-group" id="filtroCategorias"></div>
    </section>

    <main class="grid" id="gridJogos">
        <div class="status-msg">Carregando catálogo de jogos...</div>
    </main>

    <script>
        // URL configurada diretamente para o repositório dfilitto/portaljogossenac
        const URL_MAIN = 'https://raw.githubusercontent.com/dfilitto/portaljogossenac/main/catalogo.json';
        const URL_MASTER = 'https://raw.githubusercontent.com/dfilitto/portaljogossenac/master/catalogo.json';

        let listaJogos = [];
        let filtroPlatAtual = 'todas';
        let filtroCatAtual = 'todas';
        let termoBusca = '';

        const mapaPlataformas = {
            mobile: { icone: '📱', nome: 'Mobile' },
            desktop: { icone: '💻', nome: 'Desktop' },
            web: { icone: '🌐', nome: 'Web (Navegador)' }
        };

        async function carregarJogos() {
            const grid = document.getElementById('gridJogos');
            const timestamp = new Date().getTime();
            try {
                let res = await fetch(`${URL_MAIN}?t=${timestamp}`);
                if (!res.ok) {
                    res = await fetch(`${URL_MASTER}?t=${timestamp}`);
                }
                if (!res.ok) throw new Error('Catálogo ainda não gerado no repositório.');
                
                listaJogos = await res.json();
                montarFiltrosCategorias();
                renderizarJogos();
            } catch (err) {
                grid.innerHTML = `
                    <div class="status-msg">
                        ⏳ <b>Aguardando geração do catálogo...</b><br>
                        Certifique-se de que os arquivos <code>jogos.txt</code>, <code>atualizar.js</code> e <code>.github/workflows/atualizar.yml</code> já foram adicionados ao repositório <b>dfilitto/portaljogossenac</b> e que a Action gerou o arquivo <code>catalogo.json</code>.
                    </div>`;
                console.error(err);
            }
        }

        function montarFiltrosCategorias() {
            const container = document.getElementById('filtroCategorias');
            const categorias = ['todas', ...new Set(listaJogos.map(j => j.categoria))];
            
            if (categorias.length <= 2) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'flex';
            container.innerHTML = categorias.map(cat => `
                <button class="filter-btn ${cat === 'todas' ? 'active' : ''}" data-cat="${cat}">
                    ${cat === 'todas' ? '📁 Todas as Turmas/Eventos' : `🏷️ ${cat}`}
                </button>
            `).join('');

            container.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filtroCatAtual = btn.dataset.cat;
                    renderizarJogos();
                });
            });
        }

        function formatarTextoPlataformas(plats) {
            if (!plats || plats.length === 0) return 'Disponível no Itch.io';
            const nomes = plats.map(p => mapaPlataformas[p] ? mapaPlataformas[p].nome : p);
            return `Roda em: ${nomes.join(', ')}`;
        }

        function renderizarJogos() {
            const grid = document.getElementById('gridJogos');
            
            const filtrados = listaJogos.filter(jogo => {
                const batePlat = filtroPlatAtual === 'todas' || jogo.plataformas.includes(filtroPlatAtual);
                const bateCat = filtroCatAtual === 'todas' || jogo.categoria === filtroCatAtual;
                const bateBusca = jogo.titulo.toLowerCase().includes(termoBusca) || 
                                  jogo.autor.toLowerCase().includes(termoBusca);
                return batePlat && bateCat && bateBusca;
            });

            if (filtrados.length === 0) {
                grid.innerHTML = `<div class="status-msg">Nenhum jogo encontrado para este filtro.</div>`;
                return;
            }

            grid.innerHTML = filtrados.map(jogo => {
                const badgesHtml = jogo.plataformas.map(p => {
                    const info = mapaPlataformas[p] || { icone: '🎮', nome: p };
                    return `<span class="badge ${p}">${info.icone} ${info.nome}</span>`;
                }).join('');

                return `
                    <article class="card">
                        <img class="card-thumb" src="${jogo.capa}" alt="Capa do jogo ${jogo.titulo}" loading="lazy">
                        <div class="card-body">
                            <span class="card-category">${jogo.categoria}</span>
                            <h2 class="card-title">${jogo.titulo}</h2>
                            <span class="card-author">Por: ${jogo.autor}</span>
                            
                            <div class="platforms-info">
                                <span class="platforms-label">${formatarTextoPlataformas(jogo.plataformas)}</span>
                                <div class="badges">${badgesHtml}</div>
                            </div>

                            <a href="${jogo.url}" target="_blank" rel="noopener noreferrer" class="btn-play">
                                Jogar no Itch.io ↗
                            </a>
                        </div>
                    </article>
                `;
            }).join('');
        }

        document.querySelectorAll('#filtroPlataforma .filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#filtroPlataforma .filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filtroPlatAtual = btn.dataset.plat;
                renderizarJogos();
            });
        });

        document.getElementById('inputBusca').addEventListener('input', (e) => {
            termoBusca = e.target.value.toLowerCase().trim();
            renderizarJogos();
        });

        carregarJogos();
    </script>
</body>
</html>
